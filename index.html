<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Открытка</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    background-color: #ffd9e6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
    transition: background-color 0.6s;
    overflow: hidden;
    position: relative;
  }

  body.krasnyy {
    background: radial-gradient(circle, #ff8a8a, #a10e0e);
    color: #fff;
  }

  body.strashnyy {
    background: repeating-linear-gradient(
      45deg,
      #1a0000,
      #1a0000 20px,
      #4a0000 20px,
      #4a0000 40px
    );
    color: #ffdddd;
  }

  /* Карточка со свечением */
  .card {
    background: rgba(255, 255, 255, 0.85);
    padding: 40px 30px;
    border-radius: 30px;
    max-width: 500px;
    width: 90%;
    z-index: 2;
    position: relative;
    animation: glow 2.5s infinite alternate;
  }

  body.krasnyy .card { 
    background: rgba(255,255,255,0.9); 
    animation: glow-red 2s infinite alternate;
  }
  
  body.strashnyy .card { 
    background: rgba(0,0,0,0.7); 
    color: #ffdddd;
    animation: glow-dark 2s infinite alternate;
  }

  /* Анимации свечения */
  @keyframes glow {
    from { box-shadow: 0 0 20px rgba(255, 133, 161, 0.5), 0 0 40px rgba(255, 133, 161, 0.2); }
    to { box-shadow: 0 0 40px rgba(255, 133, 161, 0.9), 0 0 80px rgba(255, 133, 161, 0.6); }
  }
  @keyframes glow-red {
    from { box-shadow: 0 0 20px rgba(255, 50, 50, 0.5), 0 0 40px rgba(255, 0, 0, 0.2); }
    to { box-shadow: 0 0 40px rgba(255, 50, 50, 0.9), 0 0 80px rgba(255, 0, 0, 0.6); }
  }
  @keyframes glow-dark {
    from { box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); }
    to { box-shadow: 0 0 50px rgba(255, 0, 0, 0.8); }
  }

  h1 {
    font-size: 30px;
    margin: 15px 0 25px;
    color: #d6336c;
  }
  body.krasnyy h1 { color: #a10e0e; }
  body.strashnyy h1 { color: #ffb3b3; }

  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    font-size: 19px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s;
  }
  .btn:hover {
    transform: scale(1.05);
  }

  .btn-yes  { background: #ff85a1; color: #fff; }
  .btn-no   { background: #e75480; color: #fff; }
  .btn-light { background: #ffe0ea; color: #d6336c; border: 2px solid #ff85a1; }
  
  /* --- ГОРЯЩАЯ КНОПКА "даа" --- */
  .btn-fire {
    background: #b3003c;
    color: #fff;
    position: relative;
    z-index: 1;
    box-shadow: 0 0 10px #b3003c;
  }
  
  /* Это слой пламени вокруг кнопки */
  .btn-fire::before {
    content: '';
    position: absolute;
    top: -4px; left: -4px; right: -4px; bottom: -4px;
    border-radius: 50px;
    background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #ff0000);
    background-size: 300% 300%;
    z-index: -1;
    filter: blur(8px);
    animation: fire-glow 1.5s ease-in-out infinite alternate;
  }

  /* Пульсирующее пламя */
  @keyframes fire-glow {
    0% { 
      background-position: 0% 50%; 
      filter: blur(6px); 
      box-shadow: 0 0 15px #ff0000, 0 0 25px #ff7300;
    }
    100% { 
      background-position: 100% 50%; 
      filter: blur(14px); 
      box-shadow: 0 0 25px #fffb00, 0 0 45px #ff0000;
    }
  }
  /* -------------------------- */

  img.picture {
    max-width: 90%;
    max-height: 280px;
    border-radius: 20px;
    margin: 10px auto 20px;
    display: block;
    box-shadow: 0 5px 20px rgba(0,0,0,0.25);
  }

  .message {
    font-size: 22px;
    color: #d6336c;
    margin: 20px 0;
    line-height: 1.4;
  }
  body.krasnyy .message { color: #a10e0e; }
  body.strashnyy .message { color: #ffb3b3; }

  .hidden { display: none; }

  /* Сердечки */
  .heart {
    position: fixed;
    top: -50px;
    font-size: 26px;
    color: #ff4d88;
    animation: fall linear infinite;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes fall {
    0%   { transform: translateY(-50px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(360deg); opacity: 0.3; }
  }

  /* Убегающая кнопка */
  #btn-runaway {
    position: relative;
    transition: top 0.25s ease-out, left 0.25s ease-out;
  }
  #btn-runaway.fixed {
    position: fixed;
    z-index: 10;
    width: auto;
    padding: 14px 28px;
  }
</style>
</head>
<body>

<!-- ЭКРАН 1: главная -->
<div class="card" id="screen-main">
  <img src="kartinka0.jpg" alt="картинка" class="picture">
  <h1>хочешь меня?</h1>
  <button class="btn btn-yes" onclick="goYes()">безумна прелесть мая</button>
  <button class="btn btn-no" id="btn-runaway"
          onmouseover="runAway()" onclick="goKrasnyy()">
    ты чее ваще?? нет канеша!!!
  </button>
</div>

<!-- ЭКРАН 2: "безумна прелесть мая" -->
<div class="card hidden" id="screen-yes">
  <img src="kartinka1.jpg" alt="картинка" class="picture">
  <p class="message">вааа я тебя тожее безумна пусяяя абажайу типяя &gt;•♡•&lt;</p>
</div>

<!-- ЭКРАН 3: "уверен??" -->
<div class="card hidden" id="screen-krasnyy">
  <img src="kartinka2.jpg" alt="картинка" class="picture">
  <h1>уверен??</h1>
  <!-- Вот она, горящая кнопка -->
  <button class="btn btn-fire" onclick="goStrashnyy()">даа</button>
  <button class="btn btn-light" onclick="goMain()">неет я ваще нечаянно нажал сюда</button>
</div>

<!-- ЭКРАН 4: "чета ты ваще апупел" -->
<div class="card hidden" id="screen-strashnyy">
  <img src="kartinka3.jpg" alt="картинка" class="picture">
  <p class="message">чета ты ваще апупел</p>
  <button class="btn btn-light" onclick="goMain()">я передумааал</button>
</div>

<script>
  function show(id) {
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  function resetBg() {
    document.body.classList.remove('krasnyy', 'strashnyy');
    stopHearts();
  }

  function goYes() {
    resetBg();
    show('screen-yes');
    startHearts();
  }

  function goKrasnyy() {
    resetBg();
    document.body.classList.add('krasnyy');
    show('screen-krasnyy');
    resetRunaway();
  }

  function goStrashnyy() {
    resetBg();
    document.body.classList.add('strashnyy');
    show('screen-strashnyy');
  }

  function goMain() {
    resetBg();
    show('screen-main');
    resetRunaway();
  }

  /* Сердечки */
  let heartInterval = null;
  const heartSymbols = ['💗','💖','💕','♡','💞','🌸'];

  function spawnHeart() {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (18 + Math.random() * 22) + 'px';
    h.style.animationDuration = (3 + Math.random() * 3) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 6000);
  }

  function startHearts() {
    stopHearts();
    for (let i = 0; i < 15; i++) spawnHeart();
    heartInterval = setInterval(spawnHeart, 250);
  }

  function stopHearts() {
    if (heartInterval) { clearInterval(heartInterval); heartInterval = null; }
    document.querySelectorAll('.heart').forEach(h => h.remove());
  }

  /* Убегающая кнопка */
  const RUNAWAY_DURATION = 7000;
  let runawayActive = false;
  let runawayDone = false;
  let runawayTimer = null;
  let moveInterval = null;

  function runAway() {
    if (runawayActive || runawayDone) return;
    runawayActive = true;

    const btn = document.getElementById('btn-runaway');
    const rect = btn.getBoundingClientRect();
    btn.classList.add('fixed');
    btn.style.top  = rect.top  + 'px';
    btn.style.left = rect.left + 'px';

    function jump() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const bw = btn.offsetWidth;
      const bh = btn.offsetHeight;
      const pad = 20;
      btn.style.left = (pad + Math.random() * (w - bw - pad * 2)) + 'px';
      btn.style.top  = (pad + Math.random() * (h - bh - pad * 2)) + 'px';
    }

    jump();
    moveInterval = setInterval(jump, 700);

    runawayTimer = setTimeout(() => {
      runawayActive = false;
      runawayDone = true;
      clearInterval(moveInterval);
      moveInterval = null;
      btn.classList.remove('fixed');
      btn.style.top = '';
      btn.style.left = '';
    }, RUNAWAY_DURATION);
  }

  function resetRunaway() {
    runawayActive = false;
    runawayDone = false;
    if (runawayTimer) { clearTimeout(runawayTimer); runawayTimer = null; }
    if (moveInterval) { clearInterval(moveInterval); moveInterval = null; }
    const btn = document.getElementById('btn-runaway');
    if (!btn) return;
    btn.classList.remove('fixed');
    btn.style.top = '';
    btn.style.left = '';
  }
</script>

</body>
</html>
